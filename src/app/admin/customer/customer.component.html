<div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px 24px; margin-bottom: 18px;">
  <h2 style="margin: 0 0 4px 0; font-size: 20px; font-weight: 800; color: #212121;">Kullanıcı & Rol Yönetimi (Müşteri / Satıcı / Admin)</h2>
  <span style="font-size: 13px; color: #757575;">Sistemdeki 3 farklı rol (Customer, Seller, Admin) ve Google OAuth üyelikleri</span>
</div>

<div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 18px 24px;">
  <div
    *ngFor="let u of users"
    style="border-bottom: 1px solid #efefef; padding: 14px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
    <div>
      <div style="font-size: 15px; font-weight: 800; color: #212121;">{{ u.name }}</div>
      <div style="font-size: 12.5px; color: #757575;">{{ u.email }}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span
        style="padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #fff;"
        [style.background]="u.role === 'Admin' ? '#6b21a8' : u.role === 'Seller' ? '#008a45' : '#ff6000'">
        {{ u.role }}
      </span>
      <span style="font-size: 12.5px; font-weight: 700; color: #484848;">{{ u.status }}</span>
    </div>
  </div>
</div>
